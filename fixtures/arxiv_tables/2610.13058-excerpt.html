<figure id="S5.T1" class="ltx_table">
<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_table">Table 1: </span>Performance comparison on four long-horizon interactive benchmarks. <span id="S5.T1.5" class="ltx_text ltx_font_bold">P@1</span>
evaluates forward execution without rewind, <span id="S5.T1.6" class="ltx_text ltx_font_bold">T@1</span> enables proactive rewind within one
trial, and <span id="S5.T1.7" class="ltx_text ltx_font_bold">T@3</span> permits up to three macro attempts with reflection-guided recovery.
Every setting shares a 60-call budget per trial, including execution and reflection. Colored
annotations show absolute changes relative to P@1; bold values indicate the best result in each
column. All values are success rates (%).</figcaption>
