<!DOCTYPE html>
<html lang="ko">
<head>

  <title>메일 반응이 다음 메일을 바꾸는 루프</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #FFFFFF; --color-ink: #1F3864; --color-muted: #595959; --color-accent: #2E75B6;
            --font-sans: 'Malgun Gothic', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; --font-serif: 'Malgun Gothic', 'Noto Sans KR', sans-serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
           display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase;
               color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.01em;
         line-height: 1.2; color: var(--color-ink); margin-bottom: 0.5rem; }
    .sub { color: var(--color-muted); font-size: 0.95rem; margin-bottom: 1.25rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>

  <div class="frame">
    <p class="eyebrow">Loop · paper-harness</p>

    <p class="sub">1클릭 반응 → 매일 가중치 → 주 1회 키워드, 전부 revision 으로</p>
