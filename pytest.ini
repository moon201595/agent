[pytest]
# data/ 에는 ⑦ 코드 재현(docker_runner.py)이 clone 해 온 남의 저장소들이
# 쌓인다 — 그 저장소들의 자체 테스트/conftest.py까지 여기서 pytest가
# 같이 수집하려다 없는 의존성(habana_frameworks 등) import 에러로
# 100개 넘게 실패하는 문제가 실제로 있었다(2026-08-18). 이 프로젝트
# 자체 테스트는 전부 루트의 test_*.py 이므로 data/ 는 아예 수집 대상에서
# 뺀다 — `pytest`를 인자 없이 그냥 돌려도 안전하게.
norecursedirs = data .venv .git
