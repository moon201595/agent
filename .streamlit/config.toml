# review_app.py UI 테마 — 기준은 docs/DESIGN.md(2026-09-16). 색상 기반만 여기, 세부 모양은 review_app._inject_custom_style.
[theme]
base = "light"
primaryColor = "#3B5BDB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF2FF"
textColor = "#111827"
font = "sans serif"

# 운영 화면에는 되돌리기·가중치 저장·수신자 변경 버튼이 있고 로그인이 없다(2026-09-16). 이 PC 에서만 열리게 묶는다 —
# WSL 의 localhost 포워딩으로 Windows 브라우저의 http://localhost:8501 은 그대로 열린다.
[server]
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false
